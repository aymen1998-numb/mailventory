[project]
name = "local-order-desk"
version = "0.1.0"
description = "Local-only Gmail PDF order and inventory tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.6",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]
ocr = ["pytesseract>=0.3.13", "pdf2image>=1.17", "pillow>=10.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
